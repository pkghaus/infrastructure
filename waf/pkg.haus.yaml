---
cloudflare:
  zone_security:
    security_level: medium
    challenge_passage: 1800
    browser_integrity_check: 'on'
  # Captured from the live zone, not chosen here. Everything below was already
  # set - AUH and HSTS by hand after the account move, the rest by Cloudflare's
  # defaults - and this section exists so the next move does not need a human
  # to remember them. Changing any of these is a separate change with its own
  # reasoning.
  zone_tls:
    ssl: full
    # Raised from the 1.0 the zone carried. Not a behaviour change: a client
    # capped at TLS 1.0 or 1.1 is already refused by the edge, so the setting
    # was describing something Cloudflare does not honour. RFC 8996 deprecates
    # both, and trixie negotiates 1.3.
    min_tls_version: '1.2'
    tls_1_3: 'on'
    zero_rtt: 'off'
    always_use_https: 'on'
    automatic_https_rewrites: 'on'
    security_header:
      strict_transport_security:
        enabled: true
        max_age: 15552000
        include_subdomains: true
        # Deliberately off. Preload is a one-way door: getting a domain off the
        # browser preload list takes months, and it commits every current and
        # future subdomain to HTTPS.
        preload: false
        nosniff: false
  cache_rules:
  - ref: apt-pool-debs-immutable
    description: Pool .debs are immutable by archive invariant (reprepro
      refuses different bytes under an existing version), so cache them hard
      at the edge. Scoped to .deb files only - the listing pages in pool/
      change when packages land. 4xx/5xx pinned to no-store so a transient
      origin error cannot be cached across POPs.
    action_parameters:
      cache: true
      edge_ttl:
        mode: override_origin
        default: 2592000
        status_code_ttl:
        - status_code_range:
            from: 400
            to: 599
          value: -1
      browser_ttl:
        mode: respect_origin
    expression: |-
      (http.host eq "apt.pkg.haus")
      and (starts_with(http.request.uri.path, "/pool/"))
      and (ends_with(http.request.uri.path, ".deb"))
  - ref: apt-metadata-fresh
    description: dists/ metadata and both keyrings mutate under stable URLs; a
      mismatched cached set breaks apt update hash checks, and a stale keyring
      outlives a key rotation. Never edge-cache. Both keyrings are named
      because they rotate together and an exact match on one of them left the
      other on the zone default.
    action_parameters:
      cache: false
    expression: |-
      (http.host eq "apt.pkg.haus")
      and ((starts_with(http.request.uri.path, "/dists/"))
        or (http.request.uri.path eq "/pkghaus-archive-keyring.gpg")
        or (http.request.uri.path eq "/pkghaus-source-keyring.gpg"))
  - ref: apt-stats-respect-origin
    description: The stats page rebuilds every five minutes and says so. It
      matched none of the rules above, so a cache hit was served the zone
      default browser TTL of four hours - readers were told a refresh rate they
      could not observe. respect_origin honours the max-age the Worker sets;
      the Worker already caches the page for five minutes itself, so the rule
      only has to stop the zone default overriding it.
    action_parameters:
      cache: true
      edge_ttl:
        mode: respect_origin
      browser_ttl:
        mode: respect_origin
    expression: |-
      (http.host eq "apt.pkg.haus")
      and ((http.request.uri.path eq "/stats")
        or (http.request.uri.path eq "/stats.json"))
  - ref: buildinfos-records-immutable
    description: A build record never changes - a version, once built, is never
      rebuilt - so cache it hard. browser_ttl respect_origin is the clause that
      earns this rule; the zone default of 14400 would otherwise cut the
      worker's 30-day immutable header to four hours. Scoped to files, since a
      path ending in / is a listing with its own five-minute TTL. 4xx/5xx
      pinned to no-store so a transient error is not cached across POPs.
    action_parameters:
      cache: true
      edge_ttl:
        mode: override_origin
        default: 2592000
        status_code_ttl:
        - status_code_range:
            from: 400
            to: 599
          value: -1
      browser_ttl:
        mode: respect_origin
    expression: |-
      (http.host eq "buildinfos.pkg.haus")
      and (starts_with(http.request.uri.path, "/buildinfo-pool/"))
      and (not ends_with(http.request.uri.path, "/"))
  waf_custom_rules:
  - ref: apt-never-challenge
    description: APT is not a browser - any challenge breaks every apt update
      silently. Skip the browser-oriented zone features for the archive host,
      as insurance against future zone-security tightening.
    action: skip
    action_parameters:
      products:
      - securityLevel
      - bic
      - hot
      - uaBlock
    logging:
      enabled: true
    expression: |-
      (http.host eq "apt.pkg.haus")
  - ref: buildinfos-never-challenge
    description: The build records are fetched by curl, not only by browsers -
      the published rebuild instructions start with `curl -fsSLO`, and
      debrebuild fetches the .dsc and tarballs the same way. A challenge breaks
      those silently, exactly as it would break apt above.
    action: skip
    action_parameters:
      products:
      - securityLevel
      - bic
      - hot
      - uaBlock
    logging:
      enabled: true
    expression: |-
      (http.host eq "buildinfos.pkg.haus")
  redirect_rules:
  - ref: www-to-apex
    description: www is not a site; send it to the apex, path and query intact.
    expression: http.host eq "www.pkg.haus"
    action_parameters:
      from_value:
        target_url:
          expression: concat("https://pkg.haus", http.request.uri)
        status_code: 301
        preserve_query_string: true
  response_header_rules:
  - ref: security-headers
    description: One header set for every response that cannot set its own.
      Inert on non-HTML. The CSP ceiling is unsafe-inline because the static
      pages carry inline styles and the Plausible/copy/time scripts. /stats
      is excluded because the worker serving it sets all three headers itself
      and names its inline scripts by hash, and "set" would overwrite that
      with the ceiling. Hosts are enumerated so a new subdomain opts in
      deliberately.
    expression: http.host in {"pkg.haus" "www.pkg.haus"} or (http.host eq
      "apt.pkg.haus" and not starts_with(http.request.uri.path, "/stats"))
    action_parameters:
      headers:
        Content-Security-Policy:
          operation: set
          value: "default-src 'none'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
        X-Content-Type-Options:
          operation: set
          value: nosniff
        Referrer-Policy:
          operation: set
          value: no-referrer
