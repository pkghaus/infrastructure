---
name: Plan Rules changes

# Runs on every PR (no `paths:` filter on the trigger) so the "Run octorules
# plan" job's check always reports a status. dorny/paths-filter inside the
# job decides whether any waf/ files changed; the heavy steps are gated on
# that, so DNS-only PRs complete as a no-op success rather than no status.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write  # add_pr_comment posts the plan diff

jobs:
  octorules-plan:
    name: Run octorules plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          # 'every' = a file counts only if it matches ALL patterns (inside
          # waf/ AND not README).
          predicate-quantifier: 'every'
          filters: |
            rules:
              - 'waf/**'
              - '!waf/README.md'

      - name: No-op when no waf/ changes
        if: steps.filter.outputs.rules != 'true'
        run: echo "No waf/ changes - nothing to plan."

      - uses: actions/setup-python@v7
        if: steps.filter.outputs.rules == 'true'
        with:
          python-version: '3.13'
          cache: 'pip'

      - run: pip install -r requirements.txt
        if: steps.filter.outputs.rules == 'true'

      - uses: doctena-org/octorules-sync@803b3a5a97c77c8de108b5ecfad259810164143e  # v1.8.7
        if: steps.filter.outputs.rules == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PKGHAUS_INFRASTRUCTURE_CLOUDFLARE_API_TOKEN }}
        with:
          config_path: octorules.yaml
          force: 'Yes'
          lint: 'Yes'
          audit: 'Yes'
          add_pr_comment: 'Yes'
          pr_comment_token: ${{ secrets.GITHUB_TOKEN }}
