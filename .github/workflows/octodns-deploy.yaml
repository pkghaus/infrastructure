name: Deploy DNS changes.

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - README.md

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.PKGHAUS_INFRASTRUCTURE_CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    name: Publish DNS config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Publish to providers
        uses: solvaholic/octodns-sync@96ac518c8510c4070e8d65d299346fb03d2fd446  # v3.1.1
        with:
          config_path: octodns.yaml
          doit: --doit
          force: 'Yes'
