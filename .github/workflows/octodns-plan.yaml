name: Plan DNS changes.

# Runs on every PR (no `paths:` filter on the trigger) so the check always
# reports a status. dorny/paths-filter inside the run decides whether any
# dns/ files changed; the plan and its PR comment are gated on that, so
# WAF-only PRs complete as a no-op success instead of posting an empty plan.

on:
  pull_request:
    branches: [master]

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect dns/ changes
    runs-on: ubuntu-latest
    outputs:
      dns: ${{ steps.filter.outputs.dns }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          # 'every' = a file counts only if it matches ALL patterns (inside
          # dns/ AND not README).
          predicate-quantifier: 'every'
          filters: |
            dns:
              - 'dns/**'
              - '!dns/README.md'

  octodns-sync:
    name: Run octodns-sync plan
    needs: [changes]
    if: needs.changes.outputs.dns == 'true'
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.generate-plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - uses: solvaholic/octodns-sync@96ac518c8510c4070e8d65d299346fb03d2fd446  # v3.1.1
        id: generate-plan
        with:
          config_path: octodns.yaml

  add-pr-comment:
    name: Add plan output to PR comment
    needs: [changes, octodns-sync]
    if: needs.changes.outputs.dns == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Find previous comment, if present
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad  # v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Automatically generated by octodns-sync.

      - name: Create or update comment
        id: prcomment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9  # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          body: |
            ## OctoDNS Plan for `${{ github.ref }}`

            ${{ needs.octodns-sync.outputs.plan }}

            Automatically generated by octodns-sync.
          edit-mode: replace
