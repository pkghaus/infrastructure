name: Plan DNS changes.

on:
  pull_request:
    paths-ignore:
    - '.github/**'
    - 'README.md'

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

permissions:
  contents: read
  pull-requests: write

jobs:
  octodns-sync:
    name: Run octodns-sync plan
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.generate-plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - uses: solvaholic/octodns-sync@96ac518c8510c4070e8d65d299346fb03d2fd446  # v3.1.1
        id: generate-plan
        with:
          config_path: octodns.yaml

  add-pr-comment:
    name: Add plan output to PR comment
    needs: [octodns-sync]
    runs-on: ubuntu-latest
    steps:
      - name: Find previous comment, if present
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad  # v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Automatically generated by octodns-sync.

      - name: Create or update comment
        id: prcomment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9  # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          body: |
            ## OctoDNS Plan for `${{ github.ref }}`

            ${{ needs.octodns-sync.outputs.plan }}

            Automatically generated by octodns-sync.
          edit-mode: replace
