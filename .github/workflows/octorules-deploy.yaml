name: Deploy Rules changes

on:
  push:
    branches:
      - master
    paths:
      - 'waf/**'
      - '!waf/README.md'
      - '!rules/docs/**'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    name: Publish Rules config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Publish to providers
        uses: doctena-org/octorules-sync@a278ab9ed29451d7560c9caa9b26d0bf9f8cb9e9  # v1.8.6
        with:
          config_path: octorules.yaml
          doit: --doit
          force: 'Yes'
          lint: 'Yes'
          audit: 'Yes'
