name: CI

# The plan workflows are path-gated on dns/ and waf/, so a change to a
# workflow file itself is not covered by anything they run. This is: it
# lints every workflow on every change, including the deploy paths that
# only ever execute against production.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        # Pinned by digest; go-yaml inside it also rejects duplicate mapping
        # keys, which GitHub's parser rejects but many local checks accept.
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # actionlint above covers .github/ only, and these two files decide what
      # the live zone looks like. PyYAML takes the last of a duplicated key and
      # says nothing, and both tools treat state absent from the repo as a
      # deletion, so a key swallowed by its twin is a record removed from
      # Cloudflare on the next deploy. With DNSSEC live that is a SERVFAIL
      # rather than a wrong answer.
      #
      # System python3, no setup-python and no pip install: PyYAML is present
      # on the runner image, which is how pkghaus/buildinfos has run the same
      # line since it was written.
      - name: Reject duplicate keys
        run: |
          python3 tests/yamlcheck.py \
            octodns.yaml octorules.yaml \
            dns/*.yaml waf/*.yaml \
            .github/dependabot.yml .github/workflows/*

  config:
    name: The zone configs parse and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # The token is deliberately fake and must stay that way. octodns builds
      # its Manager -- providers included -- before it validates anything, and
      # the env-secret handler refuses to construct the Cloudflare provider
      # without the variable set. It never makes a request in validate mode:
      # verified by running it offline against this config, and by confirming it
      # exits 1 and names the value when a record is made invalid. The real
      # secret would buy nothing and would stop this job running on a fork's
      # pull request.
      - name: Validate the DNS records
        env:
          CLOUDFLARE_API_TOKEN: not-a-real-token-octodns-validate-makes-no-requests
        run: octodns-validate --config-file octodns.yaml

      # --exit-code, because without it lint reports a malformed wirefilter
      # expression as a warning and still exits 0, which is a check that gives
      # false confidence. With it: 0 clean, 1 on errors, 2 on warnings.
      # --plan free, because the zone is on the free plan and the default
      # ('enterprise') skips the entitlement checks that would catch a rule the
      # zone cannot actually run. Both verified against this config: clean
      # today, exit 2 with a corrupted expression, exit 1 on a duplicate ref.
      # No token: octorules lint needs none.
      - name: Lint the WAF rules
        run: octorules --config octorules.yaml lint --exit-code --plan free
