---
'':
  # Cloudflare Email Routing's own records: MX + SPF. ER is inbound-only
  # forwarding; outbound as @pkg.haus does not exist, hence the DMARC reject
  # below. If send-as is ever added, revisit _dmarc and add real SPF/DKIM.
  - octodns: &AUTOTTL_ONLY
      cloudflare:
        auto-ttl: true
    type: MX
    values:
      - exchange: route1.mx.cloudflare.net.
        preference: 90
      - exchange: route2.mx.cloudflare.net.
        preference: 91
      - exchange: route3.mx.cloudflare.net.
        preference: 94
  - octodns: *AUTOTTL_ONLY
    type: TXT
    value: v=spf1 include:_spf.mx.cloudflare.net ~all
  # Pin certificate issuance to the CAs GitHub Pages provisions through, plus
  # Cloudflare-compatible issuers -- the same curated set as simon.tf, which
  # fronts Pages the same way.
  - octodns: *AUTOTTL_ONLY
    type: CAA
    values:
    - flags: 0
      tag: issue
      value: comodoca.com
    - flags: 0
      tag: issuewild
      value: comodoca.com
    - flags: 0
      tag: issue
      value: digicert.com; cansignhttpexchanges=yes
    - flags: 0
      tag: issuewild
      value: digicert.com; cansignhttpexchanges=yes
    - flags: 0
      tag: issue
      value: letsencrypt.org
    - flags: 0
      tag: issuewild
      value: letsencrypt.org
    - flags: 0
      tag: issue
      value: pki.goog; cansignhttpexchanges=yes
    - flags: 0
      tag: issuewild
      value: pki.goog; cansignhttpexchanges=yes
    - flags: 0
      tag: issue
      value: ssl.com
    - flags: 0
      tag: issuewild
      value: ssl.com
  # The apex website: GitHub Pages behind the custom domain, same shape as
  # apt below. DNS-only until the Pages custom-domain check passes.
  - octodns: *AUTOTTL_ONLY
    type: A
    values:
      - 185.199.108.153
      - 185.199.109.153
      - 185.199.110.153
      - 185.199.111.153
  - octodns: *AUTOTTL_ONLY
    type: AAAA
    values:
      - 2606:50c0:8000::153
      - 2606:50c0:8001::153
      - 2606:50c0:8002::153
      - 2606:50c0:8003::153

# The APT archive: GitHub Pages behind a custom domain. DNS-only until the
# Pages custom-domain check passes; the Cloudflare proxy may be enabled after.
apt:
  octodns:
    cloudflare:
      auto-ttl: true
      comment: pkg.haus APT archive -> GitHub Pages
  type: CNAME
  value: pkghaus.github.io.

# Email Routing's DKIM key (created by ER; declared here so octodns owns the
# complete zone).
cf2024-1._domainkey:
  octodns: *AUTOTTL_ONLY
  type: TXT
  value: v=DKIM1\; h=sha256\; k=rsa\; 

# No legitimate mail originates from this domain: reject all spoofing.
_dmarc:
  octodns:
    cloudflare:
      auto-ttl: true
      comment: no legitimate outbound exists; reject all spoofing (revisit if send-as is ever added)
  type: TXT
  value: v=DMARC1\; p=reject\; sp=reject
