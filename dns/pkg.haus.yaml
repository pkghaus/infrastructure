---
'':
  # Purelymail hosts pkg.haus mail (account pkghaus@purelymail.com),
  # replacing Cloudflare Email Routing. ER was inbound-only forwarding and
  # was configured by hand, so it would not have survived the Cloudflare
  # account move; these records are codified and redeploy themselves.
  # Purelymail sends as well as receives, so SPF and DKIM below are real
  # authentication, not placeholders.
  #
  # One MX host is all Purelymail publishes: mailserver.purelymail.com.
  # has a single A record, no secondary hostname resolves, and their own
  # domain uses exactly one MX. A fabricated backup would send retries
  # into a black hole.
  - octodns: &AUTOTTL_ONLY
      cloudflare:
        auto-ttl: true
    type: MX
    values:
      - exchange: mailserver.purelymail.com.
        preference: 10
  # Both apex TXT values live in one record: octodns owns a single
  # (name, type) pair, so a second TXT entry here would collide.
  - octodns: *AUTOTTL_ONLY
    type: TXT
    values:
      - v=spf1 include:_spf.purelymail.com ~all
      - purelymail_ownership_proof=8fccbabc817815644f728d4d174a47a63104dd0fc15db9be79504b6868f06c98c852ee939a6b6116eaa83c8e9666aa95e6083fb206aaf7a8fc1eca9416c37bbf
  # Pin certificate issuance to the CAs GitHub Pages provisions through, plus
  # Cloudflare-compatible issuers -- the same curated set as simon.tf, which
  # fronts Pages the same way.
  - octodns: *AUTOTTL_ONLY
    type: CAA
    values:
    - flags: 0
      tag: issue
      value: comodoca.com
    - flags: 0
      tag: issuewild
      value: comodoca.com
    - flags: 0
      tag: issue
      value: digicert.com; cansignhttpexchanges=yes
    - flags: 0
      tag: issuewild
      value: digicert.com; cansignhttpexchanges=yes
    - flags: 0
      tag: issue
      value: letsencrypt.org
    - flags: 0
      tag: issuewild
      value: letsencrypt.org
    - flags: 0
      tag: issue
      value: pki.goog; cansignhttpexchanges=yes
    - flags: 0
      tag: issuewild
      value: pki.goog; cansignhttpexchanges=yes
    - flags: 0
      tag: issue
      value: ssl.com
    - flags: 0
      tag: issuewild
      value: ssl.com
  # The apex website. Served entirely by the pkghaus-website Worker on the
  # pkg.haus/* route: static assets, no script, and it answers its own 404s, so
  # no request reaches an origin.
  #
  # 100:: is the IPv6 discard prefix (RFC 6666) and is Cloudflare's own
  # convention for a hostname a Worker answers: attaching a Worker custom
  # domain creates exactly this record. Declaring it here instead means octodns
  # still owns every record in the zone, rather than ignoring one Cloudflare
  # created behind its back. Proxied is what makes the record work at all: the
  # edge terminates the request and the route runs, and the address is never
  # connected to.
  - octodns: &PROXIED_AND_AUTOTTL
      cloudflare:
        proxied: true
        auto-ttl: true
    type: AAAA
    value: '100::'

# The APT archive: GitHub Pages behind the Cloudflare proxy.
# The archive, same shape as the apex: the pkghaus-archive Worker owns
# apt.pkg.haus/*, serving the listing tree as static assets and pool objects
# and indices from R2, and answering misses from the archive's own 404.html.
# Nothing reaches an origin, so there is no origin to name. It was a CNAME to
# pkghaus.github.io.
apt:
  octodns: *PROXIED_AND_AUTOTTL
  type: AAAA
  value: '100::'

# The .buildinfo pool. Its own Worker, reading the same R2 bucket under the
# buildinfos/ prefix, so the Worker that serves `apt update` keeps its blast
# radius. Its own host rather than a path under apt, because
# buildinfo-pool/<initial>/<source>/ is Debian's source-pool layout, which apt
# never fetches and no Release file references: under apt.pkg.haus it read as an
# archive path while not being one. Debian separates it the same way, at
# buildinfos.debian.net, whose plural this follows: the host serves a pool of
# many records, not one.
#
# Same shape as apt above, and for the same reason: no origin exists behind it.
buildinfos:
  octodns: *PROXIED_AND_AUTOTTL
  type: AAAA
  value: '100::'

# Purelymail's DKIM keys. CNAMEs, so key rotation happens on their side
# without a zone change. Deliberately NOT proxied: a proxied CNAME would
# answer with Cloudflare addresses and break the DKIM lookup.
purelymail1._domainkey:
  octodns: *AUTOTTL_ONLY
  type: CNAME
  value: key1.dkimroot.purelymail.com.

purelymail2._domainkey:
  octodns: *AUTOTTL_ONLY
  type: CNAME
  value: key2.dkimroot.purelymail.com.

purelymail3._domainkey:
  octodns: *AUTOTTL_ONLY
  type: CNAME
  value: key3.dkimroot.purelymail.com.

# Purelymail's managed policy, which resolves to
# "v=DMARC1; p=reject; ruf=mailto:dmarc@purelymail.com" - the same
# p=reject we published ourselves, plus forensic reports to them so they
# can flag spoofing campaigns. sp is absent because subdomains inherit p.
# Unproxied: a proxied CNAME would answer with Cloudflare addresses.
_dmarc:
  octodns: *AUTOTTL_ONLY
  type: CNAME
  value: dmarcroot.purelymail.com.

# www redirects to the apex (redirect rule in waf/pkg.haus.yaml); the record
# only exists so the proxy can answer for the hostname.
www:
  octodns: *PROXIED_AND_AUTOTTL
  type: CNAME
  value: pkg.haus.
